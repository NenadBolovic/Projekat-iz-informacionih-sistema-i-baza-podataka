name: CI - Docker Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ===== UNIT TESTOVI =====
  answers-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run Answers unit tests
        uses: docker/build-push-action@v5
        with:
          context: ./answers
          file: ./answers/Dockerfile-ci
          tags: answers-test
          push: false

  authentication-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run Authentication unit tests
        uses: docker/build-push-action@v5
        with:
          context: ./authentication
          file: ./authentication/Dockerfile-ci
          tags: authentication-test
          push: false

  users-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run Users unit tests
        uses: docker/build-push-action@v5
        with:
          context: ./users
          file: ./users/Dockerfile-ci
          tags: users-test
          push: false

  formsquestions-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run FormsQuestions unit tests
        uses: docker/build-push-action@v5
        with:
          context: ./formsquestions
          file: ./formsquestions/Dockerfile-ci
          tags: formsquestions-test
          push: false

  front-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run Front unit tests
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile-ci
          tags: front-test
          push: false

  # ===== BUILD & PUSH NA DOCKER HUB =====
  answers-push:
    runs-on: ubuntu-latest
    needs: [answers-unit]
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push Answers image
        uses: docker/build-push-action@v5
        with:
          context: ./answers
          file: ./answers/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/answers:latest
          push: true

  authentication-push:
    runs-on: ubuntu-latest
    needs: [authentication-unit]
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push Authentication image
        uses: docker/build-push-action@v5
        with:
          context: ./authentication
          file: ./authentication/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/authentication:latest
          push: true

  users-push:
    runs-on: ubuntu-latest
    needs: [users-unit]
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push Users image
        uses: docker/build-push-action@v5
        with:
          context: ./users
          file: ./users/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/users:latest
          push: true

  formsquestions-push:
    runs-on: ubuntu-latest
    needs: [formsquestions-unit]
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push FormsQuestions image
        uses: docker/build-push-action@v5
        with:
          context: ./formsquestions
          file: ./formsquestions/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/formsquestions:latest
          push: true

  api-gateway-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push API Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
          push: true

  front-push:
    runs-on: ubuntu-latest
    needs: [front-unit]
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push Front image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/front:latest
          push: true
  qa-tests:
  runs-on: ubuntu-latest
  needs: [answers-push, authentication-push, users-push, formsquestions-push, front-push]
  steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Create .env from secrets
      run: echo "${{ secrets.ENV_FILE }}" > .env

    - name: Pull all services
      run: docker compose -f docker-compose.pull.yml pull

    - name: Start services
      run: docker compose -f docker-compose.pull.yml up -d

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r QA/requirements.txt

    - name: Run QA tests
      run: pytest QA/ --maxfail=1 --disable-warnings -q

    - name: Shutdown services
      if: always()
      run: docker compose -f docker-compose.pull.yml down
